[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mril"
version = "0.3.0"
description = "Model Routing Intelligence Layer — adaptive, verified-outcome-aware model routing for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
mril = "mril.cli:main"

[tool.setuptools.packages.find]
include = ["mril*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
